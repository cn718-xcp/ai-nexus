<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23165DFF'/%3E%3Cstop offset='1' stop-color='%234080FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M24 3 42 13.5v21L24 45 6 34.5v-21z' fill='url(%23g)'/%3E%3Ccircle cx='24' cy='24' r='7' fill='white' fill-opacity='.92'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-Nexus 企业级 AI 能力平台管理控制台" />
    <title>AI-Nexus · 企业级 AI 能力平台</title>
    <style>
      /* 首屏加载占位：避免 JS 加载期间白屏 */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f5f7fb;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #boot-splash .ring {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 12%, #165dff 88%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 0);
        animation: boot-spin 0.9s linear infinite;
      }
      #boot-splash .txt {
        color: #4e5969;
        font-size: 13px;
        letter-spacing: 0.12em;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash">
      <div class="ring"></div>
      <div class="txt">AI-NEXUS 正在加载…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
