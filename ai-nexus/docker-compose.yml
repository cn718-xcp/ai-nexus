# =====================================================================
# AI Nexus 一键编排：应用 + MySQL 8.0 + Redis + Milvus（内嵌 etcd/本地存储单容器）
# 使用：cp deploy/.env.example .env && docker compose up -d
# 端口默认避开宿主机常用端口，均可在 .env 中调整
# =====================================================================
name: ai-nexus

services:
  # ---------------- 应用服务 ----------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: 8080
    image: ai-nexus:latest
    container_name: ai-nexus-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 数据库 / Redis / Milvus 均走 compose 内部网络服务名
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DATABASE:-ai_nexus}
      MYSQL_USER: ${MYSQL_USER:-ainexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ainexus123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_USER: ${MILVUS_USER:-root}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:-milvus}
      # 默认使用宿主机 Ollama（模型不进容器，复用本机已拉取的模型与配置）
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped

  # ---------------- MySQL 8.0（元数据/对话历史/调用流水） ----------------
  mysql:
    image: mysql:8.0
    container_name: ai-nexus-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_nexus}
      MYSQL_USER: ${MYSQL_USER:-ainexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ainexus123}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-33061}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------- Redis（限流/幂等/缓存/分布式锁） ----------------
  redis:
    image: redis:7-alpine
    container_name: ai-nexus-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------- Milvus standalone（内嵌 etcd + 本地存储，单容器轻量部署） ----------------
  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: ai-nexus-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      # 内嵌 etcd：元数据存储于本地 RocksDB，免去独立 etcd/minio 容器
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/advanced/etcd.yaml
      COMMON_STORAGETYPE: local
      # 认证与授权配置
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MILVUS_PASSWORD:-milvus}
    ports:
      - "${MILVUS_PORT:-19531}:19530"
      - "${MILVUS_METRICS_PORT:-19091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ---------------- Ollama（可选：--profile models 启用，模型入容器） ----------------
  ollama:
    image: ollama/ollama:latest
    container_name: ai-nexus-ollama
    profiles: ["models"]
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  milvus-data:
  ollama-models:
