# =====================================================================
# 开发环境
# =====================================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_nexus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本地开发密码：支持 MYSQL_PASSWORD 环境变量覆盖；生产环境一律走 prod profile 环境变量注入
    password: "${MYSQL_PASSWORD:2626}"
  data:
    redis:
      host: localhost
      port: 6379

# dev 环境健康明细全开，便于本地排障（prod 保持 when-authorized）
management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ainexus: DEBUG
