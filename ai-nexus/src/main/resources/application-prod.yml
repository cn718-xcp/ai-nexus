# =====================================================================
# 生产环境：密码等敏感信息通过环境变量注入，禁止硬编码
# =====================================================================
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ai_nexus}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
    vectorstore:
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USER:root}
          password: ${MILVUS_PASSWORD:milvus}

logging:
  level:
    root: INFO
    com.ainexus: INFO
